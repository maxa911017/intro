<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大觀園十二花神 - 電影前導劇場</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold-primary: #d4af37;
            --gold-light: #f9f1d8;
            --gold-dark: #8a6d1c;
            --bg-deep: #0a0505; /* 微帶暗紅的極深色，增添宮廷感 */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-deep);
            /* 全局強制、唯一使用思源宋體 */
            font-family: 'Noto Serif TC', serif !important;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 流動的金箔光暈背景，零效能負擔 */
        #ambient-bg {
            position: absolute; inset: -50%; z-index: 1;
            background: 
                radial-gradient(circle at 30% 30%, rgba(212, 175, 55, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 70% 70%, rgba(138, 109, 28, 0.08) 0%, transparent 50%);
            opacity: 0;
            transition: opacity 4s ease;
            animation: breatheLight 15s infinite alternate ease-in-out;
            pointer-events: none;
        }

        @keyframes breatheLight {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(-2%, -2%); }
        }

        #gate-wrapper {
            position: absolute; inset: 0; z-index: 100;
            perspective: 2000px; /* 增加深度感 */
            display: flex; justify-content: center; align-items: center;
            background: #000; overflow: hidden;
            transition: opacity 2s ease 2s;
        }
        
        .gate-door {
            position: absolute; top: 0; width: 50vw; height: 100vh;
            background: linear-gradient(to bottom, #1a0202, #050000);
            border: 1px solid #330808;
            transition: transform 4s cubic-bezier(0.25, 1, 0.2, 1);
            display: flex; align-items: center;
            box-shadow: inset 0 0 50px rgba(0,0,0,0.8);
            will-change: transform;
        }
        .gate-door.left { left: 0; transform-origin: left; justify-content: flex-end; border-right: 3px solid #000; }
        .gate-door.right { right: 0; transform-origin: right; justify-content: flex-start; border-left: 3px solid #000; }
        
        .gate-ring-container {
            margin: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        @media (min-width: 768px) { .gate-ring-container { margin: 40px; } }

        .gate-ring {
            width: 70px; height: 70px;
            border: 4px solid var(--gold-primary); border-radius: 50%;
            box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(212, 175, 55, 0.3);
            position: relative;
        }
        .gate-ring::after {
            content: ''; position: absolute;
            top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 24px; height: 24px; background: var(--gold-primary);
            border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        /* 開門觸控區置中、優化排版 */
        .gate-trigger {
            position: absolute; z-index: 110; top: 60%; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
            cursor: pointer; padding: 2rem;
            transition: transform 0.3s ease;
        }
        
        .gate-trigger-icon {
            width: 32px; height: 32px; fill: none; stroke: var(--gold-light); stroke-width: 1.5;
            filter: drop-shadow(0 0 8px var(--gold-primary));
            animation: bounceSoft 3s infinite ease-in-out;
        }

        .gate-trigger-text {
            color: var(--gold-light); font-size: 1.4rem; font-weight: 300;
            letter-spacing: 0.8rem; margin-right: -0.8rem;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.5);
        }

        @media (min-width: 768px) {
            .gate-trigger { top: 65%; gap: 1.5rem; }
            .gate-trigger-icon { width: 40px; height: 40px; }
            .gate-trigger-text { font-size: 1.8rem; letter-spacing: 1.2rem; margin-right: -1.2rem; }
        }

        @keyframes bounceSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        @media (hover: hover) {
            .gate-trigger:hover { transform: translateX(-50%) scale(1.05); }
            .gate-trigger:hover .gate-trigger-text { color: #fff; text-shadow: 0 0 25px var(--gold-primary); }
        }

        /* 開門動畫狀態 */
        .is-opening .gate-door.left { transform: rotateY(-105deg); }
        .is-opening .gate-door.right { transform: rotateY(105deg); }
        .is-opening .gate-trigger { opacity: 0; pointer-events: none; }
        .is-hidden { opacity: 0; pointer-events: none; }

        #movie-sequence {
            position: absolute; inset: 0; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; perspective: 1000px;
        }

        .movie-quote {
            position: absolute; text-align: center; width: 85%; max-width: 800px;
            opacity: 0; transform: scale(0.9);
            will-change: transform, opacity;
            display: flex; flex-direction: column; align-items: center; gap: 1.5rem;
        }

        .movie-text-main {
            font-size: 1.6rem; font-weight: 300; color: #fff;
            letter-spacing: 0.5rem; margin-right: -0.5rem; line-height: 1.8;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
        }
        
        .movie-text-sub {
            font-size: 1rem; font-weight: 300; color: var(--gold-primary);
            letter-spacing: 0.4rem; margin-right: -0.4rem; opacity: 0.8;
        }

        @media (min-width: 768px) {
            .movie-quote { gap: 2rem; }
            .movie-text-main { font-size: 3rem; letter-spacing: 1rem; margin-right: -1rem; }
            .movie-text-sub { font-size: 1.2rem; letter-spacing: 0.6rem; margin-right: -0.6rem; }
        }

        /* 優雅平滑的文字推進特效 */
        .animate-quote {
            animation: cinematicFade 8s forwards ease-in-out;
        }

        @keyframes cinematicFade {
            0%   { opacity: 0; transform: scale(0.95) translateY(10px); filter: blur(4px); }
            20%  { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
            80%  { opacity: 1; transform: scale(1.05) translateY(0); filter: blur(0px); }
            100% { opacity: 0; transform: scale(1.1) translateY(-10px); filter: blur(4px); }
        }

        #final-screen {
            position: absolute; inset: 0; z-index: 20;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: radial-gradient(circle at center, rgba(10,5,5,0.7) 0%, var(--bg-deep) 100%);
            opacity: 0; pointer-events: none; transition: opacity 3s ease;
        }
        #final-screen.is-active { opacity: 1; pointer-events: auto; }

        .final-title {
            font-size: 2.2rem; font-weight: 500;
            letter-spacing: 0.8rem; margin-right: -0.8rem; margin-bottom: 3.5rem;
            color: var(--gold-light);
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.4);
            opacity: 0; transform: translateY(20px); transition: all 2s ease 1s;
        }
        @media (min-width: 768px) {
            .final-title { font-size: 4.5rem; letter-spacing: 1.5rem; margin-right: -1.5rem; margin-bottom: 5rem; }
        }
        #final-screen.is-active .final-title { opacity: 1; transform: translateY(0); }

        .action-button {
            position: relative; overflow: hidden;
            padding: 1.2rem 3rem; border: 1px solid rgba(212, 175, 55, 0.5);
            background: rgba(212, 175, 55, 0.05); color: #fff;
            font-size: 1.1rem; font-weight: 400; letter-spacing: 0.5rem; margin-right: -0.5rem;
            border-radius: 100px; text-decoration: none; backdrop-filter: blur(5px);
            opacity: 0; transform: translateY(20px); transition: all 2s ease 2s;
        }
        @media (min-width: 768px) {
            .action-button { padding: 1.5rem 5rem; font-size: 1.5rem; letter-spacing: 0.8rem; margin-right: -0.8rem; }
        }
        #final-screen.is-active .action-button { opacity: 1; transform: translateY(0); }
        
        .action-button::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 70%);
            animation: rotateGlow 6s linear infinite; pointer-events: none;
        }
        @keyframes rotateGlow { 100% { transform: rotate(360deg); } }

        @media (hover: hover) {
            .action-button:hover {
                background: rgba(212, 175, 55, 0.15); border-color: var(--gold-primary);
                box-shadow: 0 0 30px rgba(212, 175, 55, 0.3); color: var(--gold-light);
            }
        }

        .curator-btn {
            margin-top: 3rem; display: flex; align-items: center; gap: 0.6rem;
            background: transparent; border: none; padding: 0.5rem 1rem;
            color: rgba(255,255,255,0.5); font-size: 0.9rem; font-weight: 300; letter-spacing: 0.2rem;
            cursor: pointer; opacity: 0; transform: translateY(15px); transition: all 2s ease 3s;
        }
        @media (min-width: 768px) {
            .curator-btn { margin-top: 4rem; font-size: 1rem; letter-spacing: 0.3rem; }
        }
        #final-screen.is-active .curator-btn { opacity: 1; transform: translateY(0); }
        .curator-btn svg { width: 16px; height: 16px; fill: currentColor; }
        @media (hover: hover) {
            .curator-btn:hover { color: var(--gold-primary); }
        }

        #modal-overlay {
            position: fixed; inset: 0; z-index: 200;
            background: rgba(0,0,0,0.85); backdrop-filter: blur(8px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.4s ease;
        }
        #modal-overlay.is-open { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: #0d0a0a; border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 3rem 1.5rem; width: 90%; max-width: 900px; max-height: 85vh; overflow-y: auto;
            border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,1);
            transform: scale(0.95); transition: transform 0.4s ease; position: relative;
        }
        @media (min-width: 768px) { .modal-box { padding: 4rem; } }
        #modal-overlay.is-open .modal-box { transform: scale(1); }

        .modal-close {
            position: absolute; top: 1rem; right: 1.5rem; font-size: 2rem; font-weight: 300;
            color: rgba(255,255,255,0.5); cursor: pointer; line-height: 1;
        }

        .curator-card { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .curator-img {
            width: 140px; height: 140px; border-radius: 50%; object-fit: cover;
            border: 2px solid rgba(212, 175, 55, 0.4); padding: 4px; margin-bottom: 1.5rem;
        }
        @media (min-width: 768px) { .curator-img { width: 180px; height: 180px; margin-bottom: 2rem; } }
        
        .curator-name {
            font-size: 1.5rem; font-weight: 500; color: #fff; letter-spacing: 0.4rem; margin-right: -0.4rem; margin-bottom: 0.8rem;
        }
        .curator-desc {
            font-size: 0.95rem; font-weight: 300; color: #aaa; line-height: 1.8; letter-spacing: 0.05rem;
        }

    </style>
</head>
<body>

    <!-- 背景音樂 -->
    <audio id="bgm" loop preload="auto">
        <source src="【古风纯音乐】绝美古装剧背景音乐：忘前尘 - 古風Relaxing Music (youtube).mp3" type="audio/mpeg">
    </audio>

    <!-- 環境光暈 -->
    <div id="ambient-bg"></div>

    <!-- 開場大門 -->
    <div id="gate-wrapper">
        <div class="gate-door left"><div class="gate-ring-container"><div class="gate-ring"></div></div></div>
        <div class="gate-door right"><div class="gate-ring-container"><div class="gate-ring"></div></div></div>
        
        <div class="gate-trigger" onclick="launchExperience()">
            <svg class="gate-trigger-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C12 2 5 6 5 13C5 17 8 20 12 22C16 20 19 17 19 13C19 6 12 2 12 2Z" />
                <path d="M12 22C12 22 17 18 17 13C17 9 14 6 12 4C10 6 7 9 7 13C7 18 12 22 12 22Z" />
                <circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/>
            </svg>
            <div class="gate-trigger-text">推開大觀園</div>
        </div>
    </div>

    <!-- 電影引言序列 -->
    <div id="movie-sequence">
        <div class="movie-quote" id="text-1">
            <span class="movie-text-main">太虛幻境，大夢初醒。</span>
        </div>
        <div class="movie-quote" id="text-2">
            <span class="movie-text-main">春夢隨雲散，飛花逐水流。</span>
        </div>
        <div class="movie-quote" id="text-3">
            <span class="movie-text-main">十二月令，十二花神。</span>
            <span class="movie-text-sub">散落人間的節氣與風華</span>
        </div>
        <div class="movie-quote" id="text-4">
            <span class="movie-text-main">跨越虛實的界線，<br>凝聽，花開的聲音。</span>
        </div>
    </div>

    <!-- 最終揭曉介面 -->
    <div id="final-screen">
        <h1 class="final-title">大觀園十二花神</h1>
        <a href="https://www.thinglink.com/scene/2116467293566272165" target="_blank" class="action-button">
            進入全景世界
        </a>
        
        <button class="curator-btn" onclick="openModal()">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
            </svg>
            策展團隊
        </button>
    </div>

    <!-- 策展人彈窗 -->
    <div id="modal-overlay">
        <div class="modal-box">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            
            <div class="flex items-center justify-center gap-4 mb-10 mt-2">
                <div class="h-[1px] w-12 bg-gradient-to-r from-transparent to-[var(--gold-primary)]"></div>
                <h2 class="text-2xl tracking-[0.6rem] -mr-[0.6rem] text-[var(--gold-primary)] font-medium">策展人</h2>
                <div class="h-[1px] w-12 bg-gradient-to-l from-transparent to-[var(--gold-primary)]"></div>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-8">
                <!-- 廖冠皓 -->
                <div class="curator-card">
                    <!-- 若要換照片，請更改 src 的網址 -->
                    <img src="https://placehold.co/400x400/1a1a1a/d4af37?text=廖冠皓\n(請替換)" alt="廖冠皓" class="curator-img">
                    <h3 class="curator-name">廖冠皓</h3>
                    <p class="curator-desc">
                        核心視覺概念設計與總體統籌。<br>以細膩視角解構古典文學，將紅樓夢的十二花神轉化為數位時代的視覺饗宴。
                    </p>
                </div>
                <!-- 涂聿萱 -->
                <div class="curator-card">
                    <!-- 若要換照片，請更改 src 的網址 -->
                    <img src="https://placehold.co/400x400/1a1a1a/d4af37?text=涂聿萱\n(請替換)" alt="涂聿萱" class="curator-img">
                    <h3 class="curator-name">涂聿萱</h3>
                    <p class="curator-desc">
                        互動體驗設計與空間氛圍營造。<br>擅長結合傳統敘事與現代數位科技，編織出如夢似幻的大觀園沉浸式場景。
                    </p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isStarted = false;

        function launchExperience() {
            if(isStarted) return;
            isStarted = true;

            // 1. 處理音樂淡入
            const bgm = document.getElementById('bgm');
            bgm.volume = 0;
            const playPromise = bgm.play();
            
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    let vol = 0;
                    let fade = setInterval(() => {
                        if (vol < 0.7) {
                            vol += 0.05;
                            bgm.volume = Math.min(0.7, vol);
                        } else {
                            clearInterval(fade);
                        }
                    }, 200);
                }).catch(e => console.log("Audio play prevented:", e));
            }

            // 2. 開門動畫
            const gate = document.getElementById('gate-wrapper');
            gate.classList.add('is-opening');
            
            // 啟動背景氛圍光
            document.getElementById('ambient-bg').style.opacity = '1';
            
            // 門淡出移除
            setTimeout(() => gate.classList.add('is-hidden'), 3000);
            setTimeout(() => { gate.style.display = 'none'; }, 5000);

            // 3. 電影引言時間軸 (精準控制 CSS 動畫)
            const text1 = document.getElementById('text-1');
            const text2 = document.getElementById('text-2');
            const text3 = document.getElementById('text-3');
            const text4 = document.getElementById('text-4');
            const finalScreen = document.getElementById('final-screen');

            // 每一句播放時間為 8 秒 (CSS 動畫設定為 8s)
            setTimeout(() => text1.classList.add('animate-quote'), 2000);
            setTimeout(() => text2.classList.add('animate-quote'), 8500);
            setTimeout(() => text3.classList.add('animate-quote'), 15000);
            setTimeout(() => text4.classList.add('animate-quote'), 21500);
            
            // 4. 最終揭曉
            setTimeout(() => {
                finalScreen.classList.add('is-active');
            }, 29500); 
        }

        function openModal() {
            document.getElementById('modal-overlay').classList.add('is-open');
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.remove('is-open');
        }
    </script>
</body>
</html>
