<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大觀園十二花神 - 360穿梭前導劇場</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js 核心與控制器 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- 思源宋體 (字重 300, 400, 700, 900) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --gold-glow: rgba(212, 175, 55, 0.6);
            --bg-dark: #030202; 
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            font-family: 'Noto Serif TC', serif !important;
            color: #fff;
            user-select: none;
            -webkit-user-select: none;
            perspective: 1200px;
        }

        ::-webkit-scrollbar { display: none; }

        /* ================= 3D 畫布與遮罩 ================= */
        #canvas-container {
            position: absolute; inset: 0; z-index: 1;
            opacity: 0; transition: opacity 3s ease 1s;
            cursor: grab;
        }
        #canvas-container:active { cursor: grabbing; }

        .vignette {
            position: absolute; inset: 0; z-index: 4; pointer-events: none;
            background: radial-gradient(circle at center, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.8) 100%);
        }

        /* ================= 開場大門 ================= */
        #gate-container {
            position: absolute; inset: 0; z-index: 100;
            perspective: 2000px;
            display: flex; justify-content: center; align-items: center;
            background: #000; overflow: hidden;
            transition: transform 4s cubic-bezier(0.25, 1, 0.2, 1), opacity 2s ease 2s;
        }
        
        .door {
            position: absolute; top: 0; width: 50vw; height: 100vh;
            background-image: 
                linear-gradient(to right, rgba(0,0,0,0.85), rgba(0,0,0,0.1)),
                linear-gradient(to bottom, #6a1313, #2a0505);
            border: 2px solid #3a0808;
            transition: transform 3.5s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; align-items: center;
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9);
            will-change: transform;
        }
        .door-left { left: 0; transform-origin: left; justify-content: flex-end; border-right: 3px solid #000; }
        .door-right { right: 0; transform-origin: right; justify-content: flex-start; border-left: 3px solid #000; }
        
        .door-ring {
            width: 60px; height: 60px;
            border: 3px solid var(--gold); border-radius: 50%;
            margin: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.9), inset 0 0 15px var(--gold-glow);
            position: relative;
        }
        @media (min-width: 768px) {
            .door-ring { width: 80px; height: 80px; margin: 40px; border-width: 4px; }
        }
        .door-ring::after {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 16px; height: 16px; background: var(--gold);
            border-radius: 50%; box-shadow: 0 4px 10px rgba(0,0,0,0.8);
        }

        .gate-action-area {
            position: absolute; z-index: 110; top: 65%;
            display: flex; flex-direction: column; align-items: center; gap: 1rem;
            cursor: pointer; transition: transform 0.4s ease; padding: 2rem;
        }
        
        .gate-icon {
            width: 32px; height: 32px; fill: none; stroke: var(--gold-light); stroke-width: 1;
            filter: drop-shadow(0 0 10px var(--gold-glow));
            animation: floatIcon 4s ease-in-out infinite;
        }

        .gate-text {
            color: var(--gold-light); font-size: 1.2rem; 
            font-weight: 900; 
            letter-spacing: 0.8rem; margin-right: -0.8rem;
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4); 
        }
        @media (min-width: 768px) {
            .gate-action-area { top: 65%; gap: 1.5rem; }
            .gate-icon { width: 40px; height: 40px; }
            .gate-text { font-size: 1.5rem; letter-spacing: 1.2rem; margin-right: -1.2rem; }
        }

        @keyframes floatIcon {
            0%, 100% { transform: translateY(0); opacity: 0.8; }
            50% { transform: translateY(-8px); opacity: 1; }
        }
        
        @media (hover: hover) {
            .gate-action-area:hover { transform: scale(1.05); }
            .gate-action-area:hover .gate-icon { filter: drop-shadow(0 0 20px var(--gold)); stroke-width: 1.5; }
            .gate-action-area:hover .gate-text { text-shadow: 0 0 25px var(--gold); color: #fff;}
        }

        /* 開門動畫設定 */
        #gate-container.opened .door-left { transform: rotateY(-105deg) translateZ(0); }
        #gate-container.opened .door-right { transform: rotateY(105deg) translateZ(0); }
        #gate-container.opened .gate-action-area { opacity: 0; pointer-events: none; transform: scale(1.2); }
        #gate-container.opened { transform: scale(1.2); } 
        #gate-container.fade-out { opacity: 0; pointer-events: none; }

        /* ================= 電影引言 (完美防爆框運鏡) ================= */
        #cinematic-sequence {
            position: absolute; inset: 0; z-index: 10;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none; 
            transform-style: preserve-3d;
            perspective: 1000px; /* 增加透視距離，讓景深更穩定 */
        }

        .quote {
            position: absolute; text-align: center; width: 90%; max-width: 900px;
            opacity: 0; transform: translateZ(-1500px); /* 從極深處飛來 */
            will-change: transform, opacity;
            display: flex; flex-direction: column; align-items: center; gap: 1.2rem;
        }

        /* 手機版：縮小字體與字距，防止超出邊界 */
        .quote-main {
            font-size: 1.25rem; font-weight: 900; color: #fff;
            letter-spacing: 0.25rem; margin-right: -0.25rem; line-height: 1.8;
            word-break: keep-all; /* 防止單字被奇異切斷 */
            text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 30px rgba(0,0,0,0.8), 0 0 40px rgba(212,175,55,0.4);
        }
        
        .quote-sub {
            font-size: 0.85rem; color: var(--gold-light); font-weight: 400;
            letter-spacing: 0.2rem; margin-right: -0.2rem; opacity: 0.9;
            text-shadow: 0 2px 5px rgba(0,0,0,0.9);
        }

        /* 電腦版：恢復霸氣大字 */
        @media (min-width: 768px) {
            .quote { gap: 1.5rem; }
            .quote-main { font-size: 3rem; letter-spacing: 0.8rem; margin-right: -0.8rem; line-height: 2.2; }
            .quote-sub { font-size: 1.2rem; letter-spacing: 0.6rem; margin-right: -0.6rem; }
        }

        /* 3D 迎面爆發穿梭特效：修改透明度變化，確保放大超出螢幕前已完全消失 */
        .fly-through {
            animation: text3DWarp 9s forwards cubic-bezier(0.25, 1, 0.4, 1);
        }

        @keyframes text3DWarp {
            0%   { opacity: 0; transform: translateZ(-1500px) translateY(20px); filter: blur(20px); }
            20%  { opacity: 1; transform: translateZ(-400px) translateY(0); filter: blur(0px); }
            60%  { opacity: 1; transform: translateZ(50px) translateY(0); filter: blur(0px); }
            /* 關鍵修改：在推進到 350px 時就完全透明消失，絕對不會爆框 */
            85%  { opacity: 0; transform: translateZ(350px) translateY(-15px); filter: blur(15px); } 
            100% { opacity: 0; transform: translateZ(600px) translateY(-30px); filter: blur(30px); } 
        }

        /* ================= 最終揭曉 & 策展團隊 ================= */
        #final-reveal {
            position: absolute; inset: 0; z-index: 20;
            display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 4s ease;
            background: radial-gradient(circle at center, rgba(10,8,5,0.75) 0%, rgba(3,2,2,0.95) 100%);
            padding: 10vh 1rem 5vh 1rem; 
            overflow-y: auto; overflow-x: hidden;
        }
        @media (min-width: 768px) {
            #final-reveal { justify-content: center; padding: 2rem; }
        }
        #final-reveal.active { opacity: 1; pointer-events: auto; }

        .grand-title {
            font-size: 1.4rem; font-weight: 900; text-align: center;
            letter-spacing: 0.3rem; margin-right: -0.3rem; margin-bottom: 2.5rem;
            color: var(--gold-light);
            text-shadow: 0 0 30px rgba(212, 175, 55, 0.5), 0 5px 15px rgba(0,0,0,0.8);
            opacity: 0; transform: translateY(20px); transition: all 3s ease 1s;
            line-height: 1.6;
            white-space: normal; 
            width: 100%;
        }
        @media (min-width: 768px) {
            .grand-title { 
                font-size: 3.5rem; letter-spacing: 1.5rem; margin-right: -1.5rem; 
                margin-bottom: 4rem; white-space: nowrap; 
            }
        }
        #final-reveal.active .grand-title { opacity: 1; transform: translateY(0); }

        .curator-section {
            width: 100%; max-width: 850px;
            display: flex; flex-direction: column; align-items: center;
            opacity: 0; transform: translateY(20px); transition: all 3s ease 2s;
            margin-bottom: 2rem;
            
            background: rgba(10, 5, 5, 0.4); 
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(212, 175, 55, 0.25); 
            border-radius: 24px; 
            padding: 2.5rem 1.5rem;
            box-shadow: 0 25px 50px rgba(0,0,0,0.9), inset 0 0 30px rgba(212, 175, 55, 0.08); 
        }
        @media (min-width: 768px) {
            .curator-section { padding: 3.5rem 4rem; margin-bottom: 3rem; }
        }
        #final-reveal.active .curator-section { opacity: 1; transform: translateY(0); }

        .curator-header {
            display: flex; align-items: center; justify-content: center; gap: 1rem;
            margin-bottom: 2rem; width: 100%;
        }
        .curator-header .line {
            height: 1px; flex: 1; max-width: 60px;
            background: linear-gradient(to right, transparent, var(--gold));
        }
        .curator-header .line:last-child {
            background: linear-gradient(to left, transparent, var(--gold));
        }
        .curator-header h2 {
            font-size: 1.2rem; color: var(--gold); font-weight: 900;
            letter-spacing: 0.6rem; margin-right: -0.6rem;
        }

        .curator-profiles {
            display: flex; flex-direction: column; gap: 3rem; width: 100%;
        }
        @media (min-width: 768px) {
            .curator-profiles { flex-direction: row; gap: 4rem; }
        }

        .profile {
            flex: 1; display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        
        .avatar-ring {
            width: 100px; height: 100px;
            border: 1px solid rgba(212,175,55,0.5); border-radius: 50%;
            padding: 4px; margin-bottom: 1.5rem;
            transition: border-color 0.4s;
        }
        @media (min-width: 768px) {
            .avatar-ring { width: 140px; height: 140px; }
        }
        .profile:hover .avatar-ring { border-color: var(--gold); box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        
        .avatar-ring img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            filter: sepia(0.3) contrast(1.1); transition: filter 0.5s; 
        }
        .profile:hover .avatar-ring img { filter: sepia(0) contrast(1); }

        .profile h3 {
            font-size: 1.3rem; font-weight: 900; color: #fff;
            letter-spacing: 0.4rem; margin-right: -0.4rem; margin-bottom: 1rem;
        }
        .profile p {
            font-size: 0.9rem; color: rgba(255,255,255,0.7); font-weight: 300;
            line-height: 1.8; max-width: 280px;
        }

        .enter-portal-btn {
            position: relative; overflow: hidden; flex-shrink: 0;
            padding: 1.2rem 2.5rem; border: 1px solid var(--gold);
            background: rgba(212, 175, 55, 0.1); color: #fff;
            font-size: 1.1rem; font-weight: 900; letter-spacing: 0.3rem; margin-right: -0.3rem;
            border-radius: 100px; text-decoration: none; backdrop-filter: blur(5px);
            transition: all 0.6s ease;
            opacity: 0; transform: translateY(20px); transition: all 3s ease 3s;
            margin-bottom: 2rem;
            text-align: center;
        }
        @media (min-width: 768px) {
            .enter-portal-btn { padding: 1.5rem 5rem; font-size: 1.3rem; letter-spacing: 0.8rem; margin-right: -0.8rem; }
        }
        .enter-portal-btn::before {
            content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(212,175,55,0.2) 0%, transparent 50%);
            animation: rotateGlow 8s linear infinite; pointer-events: none;
        }
        @keyframes rotateGlow { 100% { transform: rotate(360deg); } }

        #final-reveal.active .enter-portal-btn { opacity: 1; transform: translateY(0); }
        @media (hover: hover) {
            .enter-portal-btn:hover { background: rgba(212, 175, 55, 0.25); box-shadow: 0 0 40px rgba(212, 175, 55, 0.4); color: var(--gold-light); transform: scale(1.05); }
        }

    </style>
</head>
<body>

    <audio id="bg-music" preload="auto">
        <source src="bgm.mp3" type="audio/mpeg">
    </audio>

    <!-- 3D 畫布 -->
    <div id="canvas-container"></div>
    <div class="vignette"></div>

    <!-- 開場大門 -->
    <div id="gate-container">
        <div class="door door-left"><div class="door-ring"></div></div>
        <div class="door door-right"><div class="door-ring"></div></div>
        
        <div class="gate-action-area" onclick="startCinematic()" ontouchstart="startCinematic()">
            <svg class="gate-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C12 2 5 6 5 13C5 17 8 20 12 22C16 20 19 17 19 13C19 6 12 2 12 2Z" />
                <path d="M12 22C12 22 17 18 17 13C17 9 14 6 12 4C10 6 7 9 7 13C7 18 12 22 12 22Z" />
                <circle cx="12" cy="15" r="2" fill="currentColor" stroke="none"/>
            </svg>
            <div class="gate-text">推開花世界</div>
        </div>
    </div>

    <!-- 絕對防爆框的電影引言 -->
    <div id="cinematic-sequence">
        <div class="quote" id="q0">
            <span class="quote-main">太虛幻境，大夢初醒。</span>
        </div>
        <div class="quote" id="q1">
            <span class="quote-main">百花有靈，神韻天成。</span>
            <span class="quote-sub">十二花神，以花為名，以詩傳情</span>
        </div>
        <div class="quote" id="q2">
            <span class="quote-main">對自然之美與生命之頌。</span>
        </div>
        <div class="quote" id="q3">
            <span class="quote-main">願您在花神的陪伴下，<br>遇見詩憶，遇見美好。</span>
        </div>
    </div>

    <!-- 最終揭曉 (包含高質感策展人方塊) -->
    <div id="final-reveal">
        <h1 class="grand-title">花間鏡像：十二紀元的霓裳夢迴</h1>
        
        <div class="curator-section">
            <div class="curator-header">
                <div class="line"></div>
                <h2>策展人</h2>
                <div class="line"></div>
            </div>
            
            <div class="curator-profiles">
                <!-- 涂聿萱 -->
                <div class="profile">
                    <div class="avatar-ring">
                        <img src="tu.jpg" alt="涂聿萱" onerror="this.src='https://placehold.co/400x400/1a0a0a/d4af37?text=涂'">
                    </div>
                    <h3>涂聿萱</h3>
                    <p>核心視覺概念設計與總體統籌。<br>以細膩視角解構古典文學，將紅樓夢的十二花神轉化為數位時代的視覺饗宴。</p>
                </div>
                
                <!-- 廖冠皓 -->
                <div class="profile">
                    <div class="avatar-ring">
                        <img src="liao.jpg" alt="廖冠皓" onerror="this.src='https://placehold.co/400x400/1a0a0a/d4af37?text=廖'">
                    </div>
                    <h3>廖冠皓</h3>
                    <p>互動體驗設計與空間氛圍營造。<br>擅長結合傳統敘事與現代數位科技，編織出如夢似幻的大觀園沉浸式場景。</p>
                </div>
            </div>
        </div>

        <a href="https://www.thinglink.com/scene/2116467293566272165" target="_blank" class="enter-portal-btn">
            進入全景世界
        </a>
    </div>

    <!-- ================= Three.js 強力穿梭系統 ================= -->
    <script>
        let scene, camera, renderer, controls;
        let petals = [];
        let isAutoRotating = true;
        let hasStarted = false;
        
        let isWarping = false;
        let bgSphere; // 用於儲存背景球體，創造旋轉漩渦感

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0505, 0.002);

            // ================= 強化穿梭感 1：極限超廣角起始 =================
            // 起始 FOV 設為 140 度，製造最強烈的星際隧道變形感
            camera = new THREE.PerspectiveCamera(140, window.innerWidth / window.innerHeight, 0.1, 2000);
            
            // 將鏡頭退到貼緊球體牆壁 (球體半徑 500，退到 Z=490)
            camera.position.set(0, 0, 490); 

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputEncoding = THREE.sRGBEncoding; 
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableZoom = false; 
            controls.enablePan = false;
            controls.enableDamping = true; 
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.6; 
            controls.addEventListener('start', () => { isAutoRotating = false; });

            const textureLoader = new THREE.TextureLoader();
            textureLoader.load('1.png', 
                function(texture) {
                    texture.mapping = THREE.EquirectangularReflectionMapping;
                    texture.encoding = THREE.sRGBEncoding;
                    const sphereGeo = new THREE.SphereGeometry(500, 60, 40);
                    const sphereMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.BackSide });
                    bgSphere = new THREE.Mesh(sphereGeo, sphereMat);
                    bgSphere.rotation.y = Math.PI; 
                    scene.add(bgSphere);
                },
                undefined,
                function(err) {
                    scene.background = new THREE.Color(0x1a0a0a);
                }
            );

            const ambientLight = new THREE.AmbientLight(0xffcccc, 0.8);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffd700, 1);
            directionalLight.position.set(100, 100, 50);
            scene.add(directionalLight);

            create3DPetals();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function create3DPetals() {
            const canvas = document.createElement('canvas');
            canvas.width = 64; canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.beginPath();
            ctx.moveTo(32, 5);
            ctx.bezierCurveTo(50, 5, 59, 25, 32, 59);
            ctx.bezierCurveTo(5, 25, 14, 5, 32, 5);
            
            const grad = ctx.createLinearGradient(32, 5, 32, 59);
            grad.addColorStop(0, '#ffffff'); 
            grad.addColorStop(0.5, '#f48fb1'); 
            grad.addColorStop(1, '#c2185b'); 
            
            ctx.fillStyle = grad; ctx.fill();

            const texture = new THREE.CanvasTexture(canvas);
            const material = new THREE.MeshPhysicalMaterial({
                map: texture, side: THREE.DoubleSide, transparent: true, opacity: 0.85,
                roughness: 0.5, metalness: 0.1, alphaTest: 0.1
            });

            const geometry = new THREE.PlaneGeometry(4, 4, 2, 2);
            const positions = geometry.attributes.position;
            for(let i=0; i<positions.count; i++) {
                const x = positions.getX(i); const y = positions.getY(i);
                positions.setZ(i, (x*x + y*y) * -0.05);
            }
            geometry.computeVertexNormals();

            const isMobile = window.innerWidth < 768;
            const petalCount = isMobile ? 300 : 800; 

            for (let i = 0; i < petalCount; i++) {
                const petal = new THREE.Mesh(geometry, material);
                
                const r = 30 + Math.random() * 400;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                
                petal.position.x = r * Math.sin(phi) * Math.cos(theta);
                petal.position.y = r * Math.sin(phi) * Math.sin(theta);
                petal.position.z = r * Math.cos(phi);

                petal.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
                
                const scale = 0.5 + Math.random() * 1.5;
                petal.scale.set(scale, scale, scale);

                petal.userData = {
                    rotX: (Math.random() - 0.5) * 0.05,
                    rotY: (Math.random() - 0.5) * 0.05,
                    rotZ: (Math.random() - 0.5) * 0.05,
                    fallSpeed: 0.1 + Math.random() * 0.3,
                    driftSpeed: (Math.random() - 0.5) * 0.15,
                    orbitSpeed: (Math.random() - 0.5) * 0.002
                };

                petals.push(petal);
                scene.add(petal);
            }
        }

        function onWindowResize() {
            if(camera && renderer) {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            
            // ================= 強化穿梭感 2：極致平滑的減速拋物線 =================
            if (isWarping && camera) {
                // 緩慢而綿長的推近，創造長達 30 秒以上的飛行體驗
                camera.position.z += (0.1 - camera.position.z) * 0.003;
                
                // 動態視野煞車：從超廣角 140 度平滑收斂到 70 度
                if (camera.fov > 70) {
                    camera.fov += (70 - camera.fov) * 0.003;
                    camera.updateProjectionMatrix();
                }

                // 時空漩渦：讓全景背景輕微自轉，強化暈眩與穿梭感
                if (bgSphere) {
                    bgSphere.rotation.y += 0.0015;
                }
            }

            petals.forEach(petal => {
                const data = petal.userData;
                petal.rotation.x += data.rotX;
                petal.rotation.y += data.rotY;
                
                petal.position.y -= data.fallSpeed;
                petal.position.x += data.driftSpeed;

                // ================= 強化穿梭感 3：花瓣迎面極速爆發 =================
                if (isWarping) {
                    // 根據相機距離，花瓣以極高速度衝向鏡頭
                    let warpSpeed = Math.max(1.5, camera.position.z * 0.015);
                    petal.position.z += warpSpeed; 
                    // 增加劇烈翻滾的氣流感
                    petal.rotation.z += 0.05; 
                } else {
                    petal.rotation.z += data.rotZ;
                }
                
                const x = petal.position.x;
                const z = petal.position.z;
                petal.position.x = x * Math.cos(data.orbitSpeed) - z * Math.sin(data.orbitSpeed);
                petal.position.z = x * Math.sin(data.orbitSpeed) + z * Math.cos(data.orbitSpeed);

                // 強化無縫輪迴，穿梭時花瓣從極深的遠方重新生成
                if (petal.position.y < -200 || petal.position.z > camera.position.z + 50) {
                    petal.position.y = 200 + Math.random() * 100;
                    petal.position.x = (Math.random() - 0.5) * 600;
                    petal.position.z = isWarping ? camera.position.z - 600 - Math.random()*300 : (Math.random() - 0.5) * 400 - 200;
                }
            });

            if(isAutoRotating && controls && !isWarping) controls.update(); 
            if(renderer && scene && camera) renderer.render(scene, camera);
        }

        window.onload = () => {
            initThreeJS();
        };

        function startCinematic(e) {
            if(e) e.preventDefault();
            if(hasStarted) return;
            hasStarted = true;

            const bgMusic = document.getElementById('bg-music');
            bgMusic.volume = 0;
            const playPromise = bgMusic.play();
            if (playPromise !== undefined) {
                playPromise.then(_ => {
                    let vol = 0;
                    let fadeAudio = setInterval(() => {
                        if (vol < 0.6) {
                            vol = Math.min(0.6, vol + 0.05);
                            bgMusic.volume = vol;
                        } else {
                            clearInterval(fadeAudio);
                        }
                    }, 200);
                }).catch(error => { console.log("Audio play prevented"); });
            }

            document.getElementById('canvas-container').style.opacity = '1';

            const gate = document.getElementById('gate-container');
            gate.classList.add('opened');
            setTimeout(() => gate.classList.add('fade-out'), 2000);
            setTimeout(() => { gate.style.display = 'none'; }, 4000);

            // 啟動 3D 極速穿梭運鏡
            isWarping = true;

            const q0 = document.getElementById('q0');
            const q1 = document.getElementById('q1');
            const q2 = document.getElementById('q2');
            const q3 = document.getElementById('q3');
            const finalReveal = document.getElementById('final-reveal');

            // 完美錯開的時間軸 (保證絕不重疊)
            setTimeout(() => { q0.classList.add('fly-through'); }, 500);
            setTimeout(() => { q1.classList.add('fly-through'); }, 11500);
            setTimeout(() => { q2.classList.add('fly-through'); }, 21000);
            setTimeout(() => { q3.classList.add('fly-through'); }, 30500);
            
            setTimeout(() => {
                finalReveal.classList.add('active');
                // 抵達中心點，停止穿梭，回歸完美的 360 環景，視野已平滑收回 70 度
                isWarping = false; 
            }, 40000); 

            // 第 55 秒音樂自動淡出
            setTimeout(() => {
                let currentVol = bgMusic.volume;
                let fadeOutAudio = setInterval(() => {
                    if (currentVol > 0.05) {
                        currentVol -= 0.05; 
                        bgMusic.volume = currentVol;
                    } else {
                        bgMusic.volume = 0; 
                        bgMusic.pause();    
                        clearInterval(fadeOutAudio); 
                    }
                }, 200); 
            }, 55000); 
        }
    </script>
